<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI抠图P图工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233464f0'/%3E%3Cpath d='M16 8l2 5.5 5.5 2-5.5 2L16 23l-2-5.5-5.5-2 5.5-2z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/panels/cutout.css">
<link rel="stylesheet" href="css/panels/background.css">
<link rel="stylesheet" href="css/panels/idphoto.css">
<link rel="stylesheet" href="css/panels/adjust.css">
<link rel="stylesheet" href="css/panels/beauty.css">
<link rel="stylesheet" href="css/panels/crop.css">
<link rel="stylesheet" href="css/panels/text.css">
<link rel="stylesheet" href="css/panels/sticker.css">
<link rel="stylesheet" href="css/panels/erase.css">
<link rel="stylesheet" href="css/panels/mosaic.css">
<link rel="stylesheet" href="css/panels/batch.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" data-icon="logo" data-size="20"></span>
      <span class="brand-name">AI抠图P图</span>
    </div>
    <div class="tb-group">
      <button type="button" class="tb-btn wide" id="btn-open" data-tip="打开图片" data-key="Ctrl+O"><span data-icon="imagePlus"></span><span>打开图片</span></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <button type="button" class="tb-btn icon" id="btn-undo" data-tip="撤销" data-key="Ctrl+Z" aria-label="撤销" disabled><span data-icon="undo"></span></button>
      <button type="button" class="tb-btn icon" id="btn-redo" data-tip="重做" data-key="Ctrl+Y" aria-label="重做" disabled><span data-icon="redo"></span></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group zoom-group">
      <button type="button" class="tb-btn icon" id="btn-zoom-out" data-tip="缩小" data-key="滚轮" aria-label="缩小" disabled><span data-icon="minus"></span></button>
      <button type="button" class="tb-btn zoom-val" id="btn-zoom-100" data-tip="点击切换 100% / 适应窗口" data-key="Ctrl+1" disabled>100%</button>
      <button type="button" class="tb-btn icon" id="btn-zoom-in" data-tip="放大" data-key="滚轮" aria-label="放大" disabled><span data-icon="plus"></span></button>
      <button type="button" class="tb-btn icon" id="btn-fit" data-tip="适应窗口" data-key="Ctrl+0" aria-label="适应窗口" disabled><span data-icon="fit"></span></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <button type="button" class="tb-btn wide" id="btn-compare" data-tip="按住查看原图，松开恢复" data-key="按住 \" disabled><span data-icon="compare"></span><span>对比原图</span></button>
    </div>
    <div class="tb-spacer"></div>
    <span class="engine-badge" id="engine-badge" data-tip="正在连接本地 AI 服务…"><span class="dot"></span><span class="eb-text">连接中</span></span>
    <button type="button" class="btn secondary tb-export" id="btn-export" data-tip="选择格式、画质和尺寸后下载" disabled><span class="btn-ico" data-icon="export" data-size="18"></span><span class="btn-text">导出</span><span class="btn-caret" data-icon="chevronDown" data-size="14"></span></button>
    <button type="button" class="btn primary tb-save" id="btn-save" data-tip="保存到「输出」文件夹" data-key="Ctrl+S" disabled><span class="btn-ico" data-icon="save" data-size="18"></span><span class="btn-text">保存</span></button>
  </header>

  <nav class="rail" id="rail" aria-label="功能"></nav>
  <aside class="panel" id="panel" aria-label="功能面板"></aside>

  <main class="stage" id="stage">
    <canvas id="view" class="view"></canvas>
    <canvas id="overlay" class="overlay" tabindex="-1"></canvas>
    <div class="compare-badge" aria-hidden="true">原图</div>

    <div class="empty" id="empty">
      <button type="button" class="dropzone" id="dropzone">
        <span class="dz-art" aria-hidden="true">
          <span class="dz-card c1"></span><span class="dz-card c2"></span>
          <span class="dz-main" data-icon="imagePlus" data-size="40"></span>
        </span>
        <span class="dz-title">拖入图片 · 点击打开 · <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴</span>
        <span class="dz-sub">支持 JPG、PNG、WebP，超大图片会自动缩小到 4096 像素以内</span>
        <span class="dz-cta"><span data-icon="imagePlus" data-size="18"></span>选择图片</span>
      </button>
      <div class="features">
        <div class="feat"><span data-icon="cutout" data-size="18"></span>一键抠图</div>
        <div class="feat"><span data-icon="background" data-size="18"></span>换背景</div>
        <div class="feat"><span data-icon="idphoto" data-size="18"></span>证件照</div>
        <div class="feat"><span data-icon="adjust" data-size="18"></span>调色美颜</div>
        <div class="feat"><span data-icon="erase" data-size="18"></span>消除路人</div>
        <div class="feat"><span data-icon="mosaic" data-size="18"></span>打码</div>
      </div>
      <div class="privacy"><span data-icon="lock" data-size="14"></span>所有处理都在这台电脑上完成，照片不会上传到网络</div>
    </div>

    <div class="drop-hint" id="drop-hint" hidden><div class="dh-box"><span data-icon="imagePlus" data-size="36"></span><span>松开鼠标，打开这张图片</span></div></div>

    <div class="busy" id="busy" hidden role="status" aria-live="polite">
      <div class="busy-card">
        <div class="spinner" aria-hidden="true"></div>
        <div class="busy-msg">正在处理…</div>
        <div class="busy-bar"><span></span></div>
        <div class="busy-sub"></div>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <span class="sb-item" id="sb-size"><span class="sb-k">尺寸</span><span class="sb-v">—</span></span>
    <span class="sb-item" id="sb-zoom"><span class="sb-k">缩放</span><span class="sb-v">—</span></span>
    <span class="sb-item sb-hint" id="sb-hint">打开一张图片开始</span>
    <span class="sb-spacer"></span>
    <span class="sb-item" id="sb-history"></span>
  </footer>
</div>
<input type="file" id="file-input" accept="image/*,.jpg,.jpeg,.png,.webp,.bmp,.gif" hidden>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
